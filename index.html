<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Corp Reunion | Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           BASE STYLING & MILITARY/CORP THEME
           ========================================= */
        :root {
            --primary: #0f172a; /* Deep Navy */
            --accent: #d4af37; /* Metallic Gold */
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #334155;
            --border-light: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, #f1f5f9 100%);
        }

        .registration-container {
            background: var(--card-bg);
            max-width: 750px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.1);
            overflow: hidden;
            position: relative;
        }

        /* Top Header with Logo */
        .header {
            background: var(--primary);
            color: white;
            padding: 30px 40px;
            display: flex;
            align-items: center;
            border-bottom: 4px solid var(--accent);
        }

        .custom-logo {
            max-height: 70px; /* Adjust this number to make the logo bigger or smaller */
            width: auto;
            margin-right: 25px;
            object-fit: contain;
            flex-shrink: 0; /* Ensures logo doesn't get squeezed on small screens */
        }

        .header-text h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 34px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .header-text p {
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Form Layout */
        .form-body { padding: 40px; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Full width for specific fields */
        .full-width { grid-column: 1 / -1; }

        label {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            background: #f8fafc;
            transition: all 0.3s ease;
            color: var(--primary);
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        /* File Upload Styling */
        input[type="file"] {
            background: #ffffff;
            border: 2px dashed var(--border-light);
            padding: 20px;
            cursor: pointer;
            text-align: center;
        }

        /* Submit Button */
        .submit-btn {
            background: var(--primary);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            padding: 16px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            background: #1e293b;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2);
            transform: translateY(-2px);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .submit-btn:hover::after { transform: translateX(100%); }

        /* Responsive */
        @media (max-width: 650px) {
            .form-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; text-align: center; padding: 30px 20px; }
            .custom-logo { margin-right: 0; margin-bottom: 15px; }
            .form-body { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="registration-container">
        
        <!-- HEADER SECTION -->
        <div class="header">
            <!-- Custom Logo Image -->
            <img src="logo.png" alt="Signal Corp Logo" class="custom-logo">
            
            <div class="header-text">
                <h1>Signal Corp Reunion</h1>
                <p>Official Registration & Coordination Portal</p>
            </div>
        </div>

        <!-- FORM SECTION -->
        <div class="form-body">
            <form action="https://formsubmit.co/zyeemz@gmail.com" method="POST" enctype="multipart/form-data">
                <!-- FormSubmit Configuration -->
                <input type="hidden" name="_subject" value="New Signal Corp Reunion Registration!">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://scr.zyeemzia.com"> <!-- Reloads page cleanly after sending -->

                <div class="form-grid">
                    
                    <div class="form-group">
                        <label for="ba_no">BA No</label>
                        <input type="text" id="ba_no" name="BA No" required placeholder="e.g. BA-1234">
                    </div>

                    <div class="form-group">
                        <label for="rank">Rank</label>
                        <input type="text" id="rank" name="Rank" required placeholder="e.g. Major">
                    </div>

                    <div class="form-group full-width">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="Name" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="Email Address" required placeholder="name@domain.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone No</label>
                        <input type="tel" id="phone" name="Phone No" required placeholder="+880 1700-000000">
                    </div>

                    <div class="form-group full-width">
                        <label for="family">Family (Spouse, Children)</label>
                        <input type="text" id="family" name="Family Info" placeholder="e.g. Spouse: Jane, 2 Children">
                    </div>

                    <div class="form-group full-width">
                        <label for="message">Message</label>
                        <textarea id="message" name="Message" rows="3" placeholder="Any special requests or messages..."></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="attachment">Attachment (Optional Photo / ID)</label>
                        <input type="file" id="attachment" name="Attachment" accept="image/*,.pdf">
                    </div>

                </div>

                <button type="submit" class="submit-btn">Submit Registration</button>
            </form>
        </div>
    </div>

</body>
</html>
